<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Employee Calendar</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  width: 230px;
  height: 100vh;
  background: white;
  padding: 20px;
}

.logo {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 25px;
}

.menu button {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 7px 0;
  border: 0;
  border-radius: 10px;
  background: white;
  text-align: left;
  font-size: 15px;
}

.menu button.active {
  background: #eee8ff;
}

.footer {
  position: absolute;
  bottom: 20px;
  font-size: 12px;
  color: #777;
}

.main {
  margin-left: 230px;
  padding: 20px;
}

.mobile-menu {
  display: none;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 15px;
}

.card b {
  display: block;
  font-size: 25px;
  margin-top: 8px;
}

.calendar {
  background: white;
  padding: 15px;
  border-radius: 15px;
}

.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.calendar-header button {
  padding: 8px 13px;
  border: 0;
  border-radius: 8px;
}

.weekdays,
.days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}

.weekday {
  text-align: center;
  padding: 8px 0;
  font-size: 12px;
  color: #777;
}

.day {
  min-height: 65px;
  padding: 7px;
  background: #f5f5f5;
  border-radius: 8px;
}

.day.today {
  border: 2px solid #8b5cf6;
}

.status {
  font-size: 10px;
  margin-top: 5px;
}

.note {
  font-size: 10px;
  margin-top: 3px;
}

@media(max-width:700px) {

  .sidebar {
    transform: translateX(-100%);
    transition: 0.2s;
    z-index: 10;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .main {
    margin-left: 0;
  }

  .mobile-menu {
    display: block;
    font-size: 25px;
    border: 0;
    background: none;
  }

  .cards {
    grid-template-columns: repeat(2, 1fr);
  }

}

</style>

</head>

<body>

<aside class="sidebar" id="sidebar">

<div class="logo">
Employee Calendar
</div>

<div class="menu">

<button class="active"
onclick="showPage('dashboard',this)">
🏠 Dashboard
</button>

<button onclick="showPage('calendar',this)">
📅 Calendar
</button>

<button onclick="showPage('notes',this)">
📝 Daily Notes
</button>

<button onclick="showPage('summary',this)">
📊 Work Summary
</button>

<button onclick="showPage('settings',this)">
⚙️ Settings
</button>

</div>

<div class="footer">
App created by Avinash
</div>

</aside>

<main class="main">

<button class="mobile-menu"
onclick="toggleSidebar()">
☰
</button>

<h2 id="pageTitle">
Dashboard
</h2>

<section id="dashboard"
class="page active">

<div class="cards">

<div class="card">
Full Days
<b id="fullDays">0</b>
</div>

<div class="card">
Half Days
<b id="halfDays">0</b>
</div>

<div class="card">
Full + Half
<b id="oneHalfDays">0</b>
</div>

<div class="card">
Total Days
<b id="totalDays">0</b>
</div>

</div>

</section>

<section id="calendar"
class="page">

<div class="calendar">

<div class="calendar-header">

<button onclick="changeMonth(-1)">
◀
</button>

<h3 id="monthTitle"></h3>

<button onclick="changeMonth(1)">
▶
</button>

</div>

<div class="weekdays">

<div class="weekday">Sun</div>
<div class="weekday">Mon</div>
<div class="weekday">Tue</div>
<div class="weekday">Wed</div>
<div class="weekday">Thu</div>
<div class="weekday">Fri</div>
<div class="weekday">Sat</div>

</div>

<div class="days"
id="calendarDays">
</div>

</div>

</section>

<section id="notes"
class="page">

<h3>📝 Daily Notes</h3>

<p>
Tap a date in Calendar to add a note.
</p>

</section>

<section id="summary"
class="page">

<h3>📊 Work Summary</h3>

<p>
Your work summary will appear here.
</p>

</section>

<section id="settings"
class="page">

<h3>⚙️ Settings</h3>

<p>
Settings will appear here.
</p>

</section>

<script>
  let currentDate = new Date();

let attendance = {};
let notes = {};

try {
  attendance =
    JSON.parse(
      localStorage.getItem("employeeAttendance")
    ) || {};
} catch (e) {
  attendance = {};
}

try {
  notes =
    JSON.parse(
      localStorage.getItem("employeeNotes")
    ) || {};
}


function saveData() {

  localStorage.setItem(
    "employeeAttendance",
    JSON.stringify(attendance)
  );

  localStorage.setItem(
    "employeeNotes",
    JSON.stringify(notes)
  );
}


function toggleSidebar() {

  document
    .getElementById("sidebar")
    .classList.toggle("open");
}


function showPage(pageId, button) {

  document
    .querySelectorAll(".page")
    .forEach(function(page) {
      page.classList.remove("active");
    });

  document
    .getElementById(pageId)
    .classList.add("active");

  document
    .querySelectorAll(".menu button")
    .forEach(function(btn) {
      btn.classList.remove("active");
    });

  button.classList.add("active");

  document.getElementById("pageTitle").textContent =
    button.textContent.trim();

  if (pageId === "calendar") {
    renderCalendar();
  }
}


function changeMonth(amount) {

  currentDate.setMonth(
    currentDate.getMonth() + amount
  );

  renderCalendar();
}
function renderCalendar() {

  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  const names = [
    "January", "February", "March",
    "April", "May", "June",
    "July", "August", "September",
    "October", "November", "December"
  ];

  document.getElementById("monthTitle").textContent =
    names[month] + " " + year;

  const firstDay =
    new Date(year, month, 1).getDay();

  const totalDays =
    new Date(year, month + 1, 0).getDate();

  const calendar =
    document.getElementById("calendarDays");

  calendar.innerHTML = "";

  for (let i = 0; i < firstDay; i++) {

    const empty = document.createElement("div");

    calendar.appendChild(empty);
  }

  for (let day = 1; day <= totalDays; day++) {

    const dateKey =
      year + "-" +
      String(month + 1).padStart(2, "0") + "-" +
      String(day).padStart(2, "0");

    const box = document.createElement("button");

    box.type = "button";

    box.className = "day";

    box.innerHTML = "<b>" + day + "</b>";

    box.onclick = function(event) {

      event.preventDefault();

      openDate(dateKey);

    };

    calendar.appendChild(box);
  }

  updateSummary();
       }

renderCalendar();

</script>

</body>
</html>
