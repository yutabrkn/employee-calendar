

<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Calendar</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      text-align: center;
      padding: 15px;
    }
    h1 {
      color: #2563eb;
    }
    .calendar {
      background: white;
      padding: 15px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

<div style="
  background:#2563eb;
  color:white;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  font-size:18px;
  font-weight:bold;">
  📅 Employee Calendar
</div>
  
  <h1>📅 Employee Calendar</h1>

  <div class="calendar">
    <h2>My Calendar</h2>
    <p>My attendance tracker</p>
  <div>
  <button onclick="changeMonth(-1)">⬅️</button>
  <b id="month"></b>
  <button onclick="changeMonth(1)">➡️</button>
</div>

<br>

<div id="days" style="
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;">
</div>
<script>
let currentDate = new Date();
let attendance = JSON.parse(localStorage.getItem("attendance") || "{}");

function showCalendar() {
  let year = currentDate.getFullYear();
  let month = currentDate.getMonth();

  document.getElementById("month").innerText =
    currentDate.toLocaleString("default", {
      month: "long",
      year: "numeric"
    });

  let days = document.getElementById("days");
  days.innerHTML = "";

  let firstDay = new Date(year, month, 1).getDay();
  let totalDays = new Date(year, month + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    days.innerHTML += "<div></div>";
  }

  for (let day = 1; day <= totalDays; day++) {
    let button = document.createElement("button");
    let key = year + "-" + month + "-" + day;
button.innerText = day + (attendance[key] ? " " + attendance[key] : "");
    button.style.padding = "12px 0";
    button.style.border = "1px solid #ddd";
    button.style.borderRadius = "8px";
    button.style.background = "white";

    button.onclick = function() {
  let choice = prompt(
    "Mark attendance:\n" +
    "1 = Absent\n" +
    "2 = Half Day\n" +
    "3 = Full Day\n" +
    "4 = Full + Half\n" +
    "5 = 2 Full Days"
  );

  let status = {
    "1": "🔴",
    "2": "🟡",
    "3": "🟢",
    "4": "🔵",
    "5": "🟣"
  };

  let key = year + "-" + month + "-" + day;

  if (status[choice]) {
    attendance[key] = status[choice];
    localStorage.setItem("attendance", JSON.stringify(attendance));
    button.innerText = day + " " + status[choice];
  }

  let notes = JSON.parse(localStorage.getItem("dailyNotes") || "{}");
  let note = prompt("Write a daily note (leave empty to skip):", notes[key] || "");

  if (note !== null) {
    notes[key] = note;
    localStorage.setItem("dailyNotes", JSON.stringify(notes));
    alert("Daily note saved!");
  }
};

    days.appendChild(button);
  }
}

function changeMonth(amount) {
  currentDate.setMonth(currentDate.getMonth() + amount);
  showCalendar();
}

showCalendar();
</script>
</body>
</html>
