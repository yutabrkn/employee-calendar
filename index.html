<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Employee Calendar</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f6fa;
  color: #222;
}

header {
  background: #4b4ded;
  color: white;
  padding: 18px;
  text-align: center;
}

.container {
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 15px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 16px;
  cursor: pointer;
}

</style>

</head>

<body>

<header>
  <h2>Employee Calendar</h2>
</header>

<div class="container">

  <div class="card">

    <h3>📅 Calendar</h3>

    <p>
      Your employee calendar will appear here.
    </p>

  </div>

</div>

<script>

let attendance =
  JSON.parse(
    localStorage.getItem("employeeAttendance")
  ) || {};

let notes =
  JSON.parse(
    localStorage.getItem("employeeNotes")
  ) || {};


function saveData() {

  localStorage.setItem(
    "employeeAttendance",
    JSON.stringify(attendance)
  );

  localStorage.setItem(
    "employeeNotes",
    JSON.stringify(notes)
  );

}

</script>

</body>
</html>
